<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Technology Loan</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f6f8fb;color:#102e50}
button,input,select,textarea{font:inherit}button{padding:10px 15px;border:1px solid #c7d5e5;border-radius:4px;background:#fff;color:#123657;cursor:pointer;margin:0;font-size:13px;font-weight:700}
button:hover{background:#edf4fa}.hidden{display:none!important}a{color:#1d4f8a}.muted{color:#687e96;font-size:13px}
#loginPanel{min-height:100vh;padding:1px 0 40px;background:#102f4f}.brand{text-align:center;color:#fff;padding:44px 16px 24px}
.brand .logo{width:40px;height:40px;margin:0 auto 18px;border-radius:8px;background:#f97316;display:flex;align-items:center;justify-content:center}
.brand .city{font-size:11px;letter-spacing:.12em;color:#b6c8e0;font-weight:bold}.brand h1{margin:8px 0 6px;font-size:19px}.brand .sub{font-size:12px;color:#b6c8e0}
.signin-card{max-width:360px;width:calc(100% - 32px);margin:0 auto;background:#fff;border-radius:7px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.signin-card h2{font-size:18px;margin:0 0 14px}.field{margin:14px 0}.field label,label{display:block;margin-bottom:6px;font-weight:bold}.signin-card label{font-size:12px}.signin-card label span{color:#d92d20}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;color:#162f4a}.signin-card button{width:100%;margin-top:8px;background:#1d4f8a;color:#fff}
#signinError{margin:0 0 10px;padding:9px;border-radius:4px;font-size:12px;background:#fff0ef;color:#a32018}
#appPanel{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh;background:#f6f8fb}
.sidebar{background:#143453;color:#fff;display:flex;flex-direction:column;min-height:100vh}
.sidebar-brand{padding:16px 0 25px 0;border-bottom:1px solid rgba(255,255,255,.12)}.sidebar-brand h2{margin:0 0 12px;padding:0 0 0 0;font-size:20px;color:#fff}
.sidebar-brand span{font-size:12px;color:#d2dfeb}.side-nav{display:flex;flex-direction:column;gap:5px;padding:18px 12px}
.side-link{border:0;background:transparent;color:#e4edf6;text-align:left;padding:12px 10px;border-radius:4px;font-size:13px}
.side-link:hover{background:rgba(255,255,255,.1);color:#fff}.side-link.active{background:#1c6ca6;color:white}
body.role-user .staff-only,body:not(.role-user) .user-only{display:none!important}
.sidebar-footer{margin-top:auto;padding:18px 2px 20px;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:28px}
#userInfo{font-size:12px;color:#fff;font-weight:700;overflow-wrap:anywhere}#userRole{font-size:11px;color:#b7cbe0;margin-top:-24px}
#logoutButton{border:0;background:transparent;color:#fff;text-align:left;padding:6px 0;font-size:12px}.workspace{min-width:0;padding:20px 34px 50px 34px;max-width:1500px;width:100%}
.page-header{margin:0 0 26px;padding:0;background:none;color:#102e50}.eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#68829c;font-weight:700;margin-bottom:15px}
.page-header h1{font-size:27px;line-height:1.2;margin:0 0 6px;color:#112f50}.page-header p{margin:0;color:#183e64;font-size:16px}
.toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:16px}.toolbar button{padding:9px 13px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:15px;margin-bottom:22px}.metric-card,.panel,.card,.outreach-card{background:#fff;border:1px solid #dce5ef;border-radius:7px}
.metric-card{padding:16px}.metric{font-size:27px;font-weight:bold;margin-top:10px;color:#123657}
.panel{padding:18px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5eaf0}th{background:#f8fafc}
.center-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:16px;padding:18px 20px 20px}
.cards-view{border:0;background:transparent;padding:0}.empty-state{padding:18px 20px;color:#687e96}
.outreach-card{padding:19px 18px;box-shadow:0 3px 10px rgba(19,49,78,.06);min-height:198px;display:flex;flex-direction:column;align-items:flex-start}
.outreach-card h2{font-size:23px;line-height:1.15;margin:3px 0 5px;color:#132f4e}.status-pill{border-radius:15px;padding:4px 10px;font-size:10px;font-weight:bold;margin-bottom:7px}
.status-pill.active{background:#e2f5ec;color:#08734e}.status-pill.inactive{background:#f1e9e8;color:#8c3d34}
.center-meta{font-size:12px;line-height:1.5;color:#57718d}.device-count{font-weight:700;margin:3px 0 4px;color:#152f4d}
.outreach-card button{padding:10px 14px;margin-top:auto;font-size:12px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}.formgrid label{font-size:12px}
.danger{background:#b42318;color:#fff;border-color:#b42318}.danger:hover{background:#912018}.small{padding:6px 10px;font-size:13px}
#message{padding:12px;border-radius:7px;margin:0 0 16px;background:#e8f4ff;white-space:pre-wrap}.error{background:#fff0ef!important;color:#a32018}.success{background:#e7f7ed!important;color:#17663a}
#formArea form{margin-bottom:20px}.secondary{background:#e8eef6;color:#142b4a}
@media(max-width:900px){#appPanel{grid-template-columns:190px minmax(0,1fr)}.workspace{padding:20px}.center-grid{grid-template-columns:repeat(2,minmax(210px,1fr))}.metrics{grid-template-columns:repeat(2,minmax(140px,1fr))}}
@media(max-width:620px){#appPanel{grid-template-columns:1fr}.sidebar{min-height:auto}.sidebar-brand{padding:14px 16px 12px}.side-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:10px 12px}.sidebar-footer{margin-top:0;padding:12px 16px;grid-template-columns:1fr auto;align-items:center;gap:6px}.sidebar-footer #userRole{margin:0}.workspace{padding:22px 16px}.center-grid{grid-template-columns:1fr;padding:12px}.page-header h1{font-size:24px}.metrics{grid-template-columns:repeat(2,minmax(130px,1fr))}}
</style>
</head>
<body class="signed-out">
<section id="loginPanel">
<div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
<div class="city">CITY OF ORLANDO</div><h1>Community Technology Loan Project</h1><div class="sub">Equipment Portal</div></div>
<div class="signin-card">
<h2 id="authTitle">Sign In</h2>
<div id="signinError" class="hidden"></div>
<form id="loginForm">
<div class="field"><label for="email">Email Address <span>*</span></label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></div>
<div class="field"><label for="password">Password <span>*</span></label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"></div>
<button type="submit" id="loginButton">Sign In</button>
</form>
<form id="signupForm" class="hidden">
<div class="field"><label for="suEmail">Email Address <span>*</span></label><input id="suEmail" type="email" autocomplete="username" required></div>
<div class="field"><label for="suPassword">Password (12+ characters) <span>*</span></label><input id="suPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></div>
<div class="field"><label for="suConfirm">Confirm Password <span>*</span></label><input id="suConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></div>
<button type="submit" id="signupButton">Create Account</button>
</form>
<p class="muted" style="text-align:center;margin:12px 0 0"><a href="#" id="authToggle">New here? Create an account</a></p>
</div>
</section>
<section id="appPanel" class="hidden">
<aside class="sidebar">
<div class="sidebar-brand"><h2>Tech Loan</h2><span>City of Orlando</span></div>
<nav class="side-nav">
<button class="side-link" data-tab="dashboard" data-permission="inventory:read">Dashboard</button>
<button class="side-link staff-only" data-tab="inventory" data-permission="inventory:read">Device Inventory</button>
<button class="side-link" data-tab="centers" data-permission="centers:read">Outreach Centers</button>
<button class="side-link staff-only" data-tab="loans" data-permission="loans:read">Loans</button>
<button class="side-link staff-only" data-tab="users" data-permission="users:read">Users</button>
<button class="side-link staff-only" data-tab="requests" data-permission="requests:read">Requests</button>
<button class="side-link staff-only" data-tab="reasons" data-permission="loan-reasons:read">Loan Reasons</button>
<button class="side-link staff-only" data-tab="maintenance" data-permission="maintenance:read">Maintenance</button>
<button class="side-link user-only" data-tab="myloans" data-permission="my-loans:read">My Equipment</button>
<button class="side-link user-only" data-tab="myrequests" data-permission="my-requests:read">My Requests</button>
<button class="side-link" data-tab="settings">Settings</button>
</nav>
<div class="sidebar-footer"><strong id="userInfo"></strong><span id="userRole"></span><button id="logoutButton">Logout</button></div>
</aside>
<main class="workspace">
<div id="message" class="hidden"></div>
<header class="page-header"><div class="eyebrow">City of Orlando · Community Technology Loan Project</div><h1 id="tableTitle">Outreach Centers</h1><p id="pageDescription"></p></header>
<div class="toolbar"><button id="refreshButton" class="secondary">Refresh data</button><button id="addButton" class="hidden"></button></div>
<div class="metrics staff-only">
<div class="metric-card"><div class="muted">Devices</div><div class="metric" id="deviceCount">—</div></div>
<div class="metric-card"><div class="muted">Available devices</div><div class="metric" id="availableCount">—</div></div>
<div class="metric-card"><div class="muted">Outreach centers</div><div class="metric" id="centerCount">—</div></div>
<div class="metric-card"><div class="muted">Loan reasons</div><div class="metric" id="reasonCount">—</div></div>
</div>
<section id="contentPanel" class="panel"><div id="formArea"></div><div class="table-wrap" id="tableContent">Sign in to load data.</div></section>
</main>
</section>
<script>
const API="";
let token="",user=null,activeTab="inventory";
const data={inventory:[],centers:[],reasons:[],loans:[],maintenance:[],users:[],requests:[],myloans:[],myrequests:[]};
const isUser=()=>user&&user.role==="USER";
const can=permission=>Boolean(user&&user.permissions&&user.permissions.includes(permission));
const $=id=>document.getElementById(id);
function message(text,type=""){const el=$("message");el.textContent=text;el.className=type;el.classList.remove("hidden")}
function clearMessage(){$("message").classList.add("hidden")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,options={}){
 const headers={Accept:"application/json",...(options.body?{"Content-Type":"application/json"}:{}),...(token?{Authorization:"Bearer "+token}:{})};
 const response=await fetch(API+path,{...options,headers});
 let body;try{body=await response.json()}catch{body={}}
 if(!response.ok){const e=Error(body.error||body.message||("HTTP "+response.status+" from "+path));if(body.details){const f=body.details.fieldErrors||{};e.details=Object.entries(f).map(([k,v])=>k+": "+v.join(", ")).join("\n")}throw e}
 return body;
}
function listFrom(body){const d=body.data??body;return Array.isArray(d)?d:(Array.isArray(d.items)?d.items:[])}
async function load(path){return listFrom(await api(path))}
async function enter(result){
 token=result.token;user=result.user;
 $("loginPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");document.body.classList.remove("signed-out");$("signinError").classList.add("hidden");
 document.body.classList.toggle("role-user",isUser());
 $("userInfo").textContent=user.email;
 $("userRole").textContent=user.role;
 document.querySelectorAll("[data-permission]").forEach(el=>el.classList.toggle("hidden",!can(el.dataset.permission)));
 activeTab=isUser()?"myloans":(user.role==="STAFF"&&can("requests:read")?"requests":"centers");
 await refreshData();
}
function authError(text){$("signinError").textContent=text;$("signinError").classList.remove("hidden")}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMessage();$("loginButton").disabled=true;$("loginButton").textContent="Signing in…";
 try{
  const result=await api("/v1/auth/login",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});
  $("password").value="";await enter(result);message("Signed in successfully.","success");
 }catch(err){authError("Login failed: "+err.message)}
 finally{$("loginButton").disabled=false;$("loginButton").textContent="Sign In"}
});
$("signupForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMessage();
 if($("suPassword").value!==$("suConfirm").value){authError("Passwords do not match.");return}
 $("signupButton").disabled=true;
 try{
  const result=await api("/v1/auth/register",{method:"POST",body:JSON.stringify({email:$("suEmail").value.trim(),password:$("suPassword").value})});
  $("suPassword").value="";$("suConfirm").value="";await enter(result);message("Account created. Welcome!","success");
 }catch(err){authError("Sign up failed: "+err.message)}
 finally{$("signupButton").disabled=false}
});
$("authToggle").addEventListener("click",e=>{
 e.preventDefault();const signingUp=$("signupForm").classList.contains("hidden");
 $("signupForm").classList.toggle("hidden",!signingUp);$("loginForm").classList.toggle("hidden",signingUp);
 $("authTitle").textContent=signingUp?"Create Account":"Sign In";
 $("authToggle").textContent=signingUp?"Already have an account? Sign in":"New here? Create an account";
 $("signinError").classList.add("hidden");
});
$("logoutButton").addEventListener("click",()=>{token="";user=null;document.body.classList.remove("role-user");Object.keys(data).forEach(k=>data[k]=[]);$("appPanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");document.body.classList.add("signed-out");$("password").value="";clearMessage()});
$("refreshButton").addEventListener("click",refreshData);
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.tab)));
async function refreshData(){
 clearMessage();$("tableContent").textContent="Loading data…";
 const paths=isUser()?{
  ...(can("centers:read")?{centers:"/v1/centers?limit=100"}:{}),
  ...(can("loan-reasons:read")?{reasons:"/v1/loan-reasons"}:{}),
  ...(can("my-loans:read")?{myloans:"/v1/me/loans"}:{}),
  ...(can("my-requests:read")?{myrequests:"/v1/me/requests"}:{})
 }:{
  ...(can("inventory:read")?{inventory:"/v1/inventory?limit=100"}:{}),
  ...(can("centers:read")?{centers:"/v1/centers?limit=100"}:{}),
  ...(can("loan-reasons:read")?{reasons:"/v1/loan-reasons?limit=100"}:{}),
  ...(can("loans:read")?{loans:"/v1/loans?limit=100"}:{}),
  ...(can("maintenance:read")?{maintenance:"/v1/maintenance?limit=100"}:{}),
  ...(can("requests:read")?{requests:"/v1/requests"}:{}),
  ...(can("users:read")?{users:"/v1/users"}:{})
 };
 const results=await Promise.allSettled(Object.entries(paths).map(async([k,p])=>{data[k]=await load(p);return k}));
 const failures=results.map((r,i)=>r.status==="rejected"?Object.keys(paths)[i]+": "+r.reason.message:null).filter(Boolean);
 $("deviceCount").textContent=data.inventory.length;
 $("availableCount").textContent=data.inventory.filter(x=>x.status==="AVAILABLE").length;
 $("centerCount").textContent=data.centers.length;$("reasonCount").textContent=data.reasons.length;
 render(activeTab);
 if(failures.length)message("Some sections could not load:\n"+failures.join("\n"),"error");
}
function table(headers,rows){if(!rows.length)return "<p>No records found.</p>";return "<table><thead><tr>"+headers.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(row=>"<tr>"+row.map(x=>"<td>"+(x&&x.html?x.html:esc(x??""))+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}
const nameOf=(list,key,id,label)=>{const x=list.find(i=>i[key]===id);return x?label(x):String(id)};
const deviceName=id=>nameOf(data.inventory,"deviceId",id,d=>d.assetTag+" · "+d.manufacturer+" "+d.model);
const centerName=id=>nameOf(data.centers,"centerId",id,c=>c.centerName);
const reasonName=id=>nameOf(data.reasons,"reasonId",id,r=>r.reasonName);
const requestReason=x=>(x.reasonId?reasonName(x.reasonId)+": ":"")+x.reasonText;
const fmt=v=>v?new Date(v).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):"";
const ADDABLE={myrequests:"Request equipment",inventory:"Add equipment",centers:"Add center",reasons:"Add loan reason",loans:"Assign equipment (new loan)",maintenance:"Add maintenance record",users:"Add user"};
function actionBtn(label,fn,cls=""){return '<button class="small '+cls+'" onclick="'+fn+'">'+label+'</button>'}
function centerCards(centers){
 if(!centers.length)return '<p class="empty-state">No outreach centers found.</p>';
 return '<div class="center-grid">'+centers.map(c=>{
  const count=data.inventory.filter(d=>d.centerId===c.centerId).length;
  return '<article class="outreach-card"><h2>'+esc(c.centerName)+'</h2><span class="status-pill '+(c.isActive?'active':'inactive')+'">'+(c.isActive?'Active':'Inactive')+'</span><div class="center-meta">'+esc(c.address)+'<br>'+esc(c.phone)+'</div><div class="device-count">'+count+' '+(count===1?'Device':'Devices')+'</div><button type="button" onclick="viewCenter('+Number(c.centerId)+')">View Center</button>'+(can("centers:write")?'<button type="button" class="secondary" onclick="toggleCenter('+Number(c.centerId)+','+!c.isActive+')">'+(c.isActive?'Deactivate':'Activate')+'</button>':'')+'</article>';
 }).join('')+'</div>';
}
function viewCenter(id){
 const center=data.centers.find(c=>c.centerId===id);if(!center)return;
 const devices=data.inventory.filter(d=>d.centerId===id);
 $("tableTitle").textContent=center.centerName;
 $("pageDescription").textContent=center.address+' · '+center.phone;
 $("contentPanel").classList.remove('cards-view');
 $("tableContent").innerHTML='<button type="button" class="secondary" onclick="render(\'centers\')">Back to Outreach Centers</button><h2>Equipment at this center</h2>'+table(["Asset Tag","Type","Manufacturer","Model","Status"],devices.map(d=>[d.assetTag,d.deviceType,d.manufacturer,d.model,d.status]));
}
function render(tab){
 activeTab=tab;let title,headers,rows;
 $("formArea").innerHTML="";
 if(tab==="dashboard"){title="Dashboard";headers=[];rows=[]}
 else if(tab==="settings"){title="Settings";headers=[];rows=[]}
 else if(tab==="myloans"){title="My Equipment";headers=["Equipment","Type","Checked out","Due","Returned","Status"];rows=data.myloans.map(x=>[x.device?x.device.assetTag+" · "+x.device.manufacturer+" "+x.device.model:x.deviceId,x.device?x.device.deviceType:"",fmt(x.checkoutDate),fmt(x.dueDate),fmt(x.returnDate),x.loanStatus])}
 else if(tab==="myrequests"){title="My Requests";headers=["#","Equipment type","Outreach center","Reason","Submitted","Status"].concat(can("my-requests:write")?[""]:[]);rows=data.myrequests.map(x=>[x.requestId,x.deviceType,centerName(x.centerId),requestReason(x),fmt(x.createdAt),x.status].concat(can("my-requests:write")?[x.status==="PENDING"?{html:actionBtn("Cancel","cancelRequest("+x.requestId+")","secondary")} : ""]:[]))}
 else if(tab==="requests"){title="Equipment Requests";headers=["#","User","Type wanted","Outreach center","Reason","Submitted","Status"].concat(can("requests:write")?["Action"]:[]);rows=data.requests.map(x=>[x.requestId,x.userEmail,x.deviceType,centerName(x.centerId),requestReason(x),fmt(x.createdAt),x.status].concat(can("requests:write")?[x.status==="PENDING"?{html:actionBtn("Assign","approveRequest("+x.requestId+")")+actionBtn("Deny","denyRequest("+x.requestId+")","danger")} : ""]:[]))}
 else if(tab==="inventory"){title="Inventory";headers=["ID","Asset Tag","Serial Number","Type","Manufacturer","Model","Status","Center"];rows=data.inventory.map(x=>[x.deviceId,x.assetTag,x.serialNumber,x.deviceType,x.manufacturer,x.model,x.status,x.centerId])}
 else if(tab==="reasons"){title="Loan Reasons";headers=["ID","Reason"];rows=data.reasons.map(x=>[x.reasonId,x.reasonName])}
 else if(tab==="loans"){title="Loans";headers=["ID","Equipment","Center","Reason","Borrower","Checkout","Due","Returned","Status"].concat(can("loans:write")?["Action"]:[]);rows=data.loans.map(x=>[x.loanId,deviceName(x.deviceId),centerName(x.centerId),reasonName(x.reasonId),x.participantCode,fmt(x.checkoutDate),fmt(x.dueDate),fmt(x.returnDate),x.loanStatus].concat(can("loans:write")?[x.loanStatus==="RETURNED"?"":{html:actionBtn("Edit","editLoan("+x.loanId+")","secondary")+actionBtn("Mark returned","returnLoan("+x.loanId+")")}]:[]))}
 else if(tab==="users"){title="Users";headers=["ID","Email","Role","Active"].concat(can("users:write")?["Action"]:[]);rows=data.users.map(x=>[x.userId,x.email,x.role,x.isActive?"Yes":"No"].concat(can("users:write")?[{html:actionBtn(x.isActive?"Deactivate":"Activate","toggleUser("+x.userId+","+!x.isActive+")",x.isActive?"danger":"")}]:[]))}
 else if(tab==="centers"){title="Outreach Centers";headers=[];rows=[]}
 else{title="Maintenance";headers=["ID","Device","Issue","Service Date","Resolved","Status"].concat(can("maintenance:write")?["Action"]:[]);rows=data.maintenance.map(x=>[x.maintenanceId,x.deviceId,x.issueDescription,x.serviceDate,x.resolvedDate,x.maintenanceStatus].concat(can("maintenance:write")?[x.maintenanceStatus==="RESOLVED"?"":{html:actionBtn("Mark resolved","resolveMaintenance("+x.maintenanceId+")")}]:[]))}
 $("tableTitle").textContent=title;
 const descriptions={dashboard:"A quick view of the Community Technology Loan program.",inventory:"Devices available through the technology loan program.",centers:"Community locations participating in the technology loan program.",loans:"Current and past equipment loans.",users:"Accounts with access to the loan program.",requests:"Equipment requests submitted by program participants.",reasons:"Categories used to describe equipment loans.",maintenance:"Equipment currently in or previously through maintenance.",myloans:"Equipment checked out to your account.",myrequests:"Track your equipment requests.",settings:"Your signed-in account details."};
 $("pageDescription").textContent=descriptions[tab]||"";
 $("contentPanel").classList.toggle('cards-view',tab==="centers");
 $(".metrics").classList.toggle("hidden",tab==="centers"||tab==="settings"||tab==="myloans"||tab==="myrequests");
 if(tab==="centers")$("tableContent").innerHTML=centerCards(data.centers);
 else if(tab==="dashboard")$("tableContent").innerHTML='<p>Use the navigation to manage inventory, centers, loans, users, and program requests.</p>';
 else if(tab==="settings")$("tableContent").innerHTML='<p><strong>Signed in as:</strong> '+esc(user.email)+'</p><p><strong>Account type:</strong> '+esc(user.role)+'</p>';
 else $("tableContent").innerHTML=table(headers,rows);
 document.querySelectorAll("[data-tab]").forEach(el=>el.classList.toggle("active",el.dataset.tab===tab));
 const addPermission={myrequests:"my-requests:write",inventory:"inventory:write",centers:"centers:write",reasons:"loan-reasons:write",loans:"loans:assign",maintenance:"maintenance:write",users:"users:write"};
 const add=$("addButton");const canAdd=Boolean(ADDABLE[tab]&&can(addPermission[tab]));
 add.classList.toggle("hidden",!canAdd);if(canAdd)add.textContent="+ "+ADDABLE[tab];
}
$("addButton").addEventListener("click",()=>showForm(activeTab));
const val=id=>$(id).value.trim();
function field(id,label,type="text",extra=""){return '<div><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+extra+' required></div>'}
function select(id,label,opts,required=false){return '<div><label for="'+id+'">'+label+'</label><select id="'+id+'" '+(required?'required':'')+'>'+(required?'<option value="">Select '+esc(label.toLowerCase())+'</option>':'')+opts.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join("")+'</select></div>'}
function selectedId(id,label){const raw=$(id)?.value;const n=Number(raw);if(!raw||!Number.isSafeInteger(n)||n<=0)throw Error('Choose a valid '+label+'.');return n}
function showForm(tab){
 let body,submit;
 if(tab==="inventory"){
  const centers=data.centers.filter(c=>c.isActive).map(c=>[c.centerId,c.centerName]);
  if(!centers.length){message("Add an outreach center first. Equipment must belong to a center.","error");return}
  body=field("f_asset","Asset tag","text",'maxlength="50"')+field("f_serial","Serial number","text",'maxlength="100"')+
   select("f_type","Type",[["LAPTOP","Laptop"],["TABLET","Tablet"],["HOTSPOT","Hotspot"]])+field("f_make","Manufacturer","text",'maxlength="100"')+field("f_model","Model","text",'maxlength="100"')+
   select("f_status","Status",[["AVAILABLE","Available"],["MAINTENANCE","Maintenance"]])+select("f_center","Outreach center",centers);
  submit=()=>["/v1/inventory",{assetTag:val("f_asset"),serialNumber:val("f_serial"),deviceType:$("f_type").value,manufacturer:val("f_make"),model:val("f_model"),status:$("f_status").value,centerId:Number($("f_center").value)}];
 }else if(tab==="centers"){
  body=field("f_name","Center name","text",'maxlength="100"')+field("f_addr","Address","text",'maxlength="255"')+field("f_phone","Phone","tel",'maxlength="20"');
  submit=()=>["/v1/centers",{centerName:val("f_name"),address:val("f_addr"),phone:val("f_phone"),isActive:true}];
 }else if(tab==="reasons"){
  body=field("f_reason","Reason","text",'maxlength="100" placeholder="e.g. Job search"');
  submit=()=>["/v1/loan-reasons",{reasonName:val("f_reason")}];
 }else if(tab==="loans"){
  const devices=data.inventory.filter(d=>d.status==="AVAILABLE").map(d=>[d.deviceId,d.assetTag+" · "+d.manufacturer+" "+d.model]);
  const centers=data.centers.filter(c=>c.isActive).map(c=>[c.centerId,c.centerName]);
  const reasons=data.reasons.map(r=>[r.reasonId,r.reasonName]);
  if(!devices.length){$("formArea").innerHTML='<div class="error" style="padding:12px;border-radius:7px;margin:12px 0">No equipment is available to loan. Add equipment, or mark an active loan returned or a maintenance record resolved first.</div>';return}
  if(!centers.length||!reasons.length){const need=[!centers.length?"an outreach center":"",!reasons.length?"a loan reason":""].filter(Boolean).join(" and ");$("formArea").innerHTML='<div id="message" class="error" style="display:block">To assign equipment you first need '+need+'. '+(can("centers:write")||can("loan-reasons:write")?"Add it from the relevant tab.":"Ask an admin to add it.")+'</div>';return}
  const now=new Date(),due=new Date(now.getTime()+14*864e5),loc=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  body=select("f_device","Equipment",devices)+select("f_lcenter","Outreach center",centers)+select("f_lreason","Reason",reasons)+
   select("f_user","Assign to user account",[["","None (walk-in, enter name below)"]].concat(data.users.filter(u=>u.role==="USER"&&u.isActive).map(u=>[u.userId,u.email])))+
   '<div><label for="f_code">Borrower name / ID (optional when a user is chosen)</label><input id="f_code" type="text" maxlength="50" placeholder="Name or participant ID"></div>'+
   field("f_out","Checkout","datetime-local",'value="'+loc(now)+'"')+field("f_due","Due","datetime-local",'value="'+loc(due)+'"');
  submit=()=>["/v1/loans",{deviceId:Number($("f_device").value),centerId:Number($("f_lcenter").value),reasonId:Number($("f_lreason").value),...($("f_user").value?{userId:Number($("f_user").value)}:{}),...(val("f_code")?{participantCode:val("f_code")} :{}),checkoutDate:new Date($("f_out").value).toISOString(),dueDate:new Date($("f_due").value).toISOString()}];
 }else if(tab==="myrequests"){
  const centers=data.centers.filter(c=>c.isActive).map(c=>[c.centerId,c.centerName+" — "+c.address]);
  if(!centers.length){message("No active outreach centers are available. Please contact staff.","error");return}
  body=select("f_rcen","Outreach center",centers,true)+
   select("f_rtype","What do you need?",[["LAPTOP","Laptop"],["TABLET","Tablet"],["HOTSPOT","Wi-Fi hotspot"]])+
   select("f_rreason","Category (optional)",[["","— none —"]].concat(data.reasons.map(r=>[r.reasonId,r.reasonName])))+
   '<div style="grid-column:1/-1"><label for="f_rtext">Why do you need it?</label><textarea id="f_rtext" maxlength="1000" rows="3" style="width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:6px;font:inherit" required></textarea></div>';
  submit=()=>["/v1/me/requests",{centerId:selectedId("f_rcen","outreach center"),deviceType:$("f_rtype").value,...($("f_rreason").value?{reasonId:Number($("f_rreason").value)}:{}),reasonText:val("f_rtext")}];
 }else if(tab==="maintenance"){
  const devices=data.inventory.map(d=>[d.deviceId,d.assetTag+" · "+d.manufacturer+" "+d.model]);
  if(!devices.length){message("Add equipment first.","error");return}
  body=select("f_mdev","Equipment",devices)+field("f_issue","Issue","text",'maxlength="1000"')+field("f_sdate","Service date","date",'value="'+new Date().toISOString().slice(0,10)+'"');
  submit=()=>["/v1/maintenance",{deviceId:Number($("f_mdev").value),issueDescription:val("f_issue"),serviceDate:$("f_sdate").value}];
 }else{
  body=field("f_email","Email","email",'maxlength="255" placeholder="name@orlando.gov"')+field("f_pass","Password (12+ characters)","password",'minlength="12" maxlength="256" autocomplete="new-password"')+
   select("f_role","Role",[["USER","User (own equipment and requests)"],["STAFF","Staff (inventory, centers, assign equipment)"],["ADMIN","Admin (full access)"]]);
  submit=()=>["/v1/users",{email:val("f_email"),password:$("f_pass").value,role:$("f_role").value}];
 }
 $("formArea").innerHTML='<form id="addForm"><div class="formgrid">'+body+'</div><button type="submit">Save</button><button type="button" class="secondary" id="cancelForm">Cancel</button></form>';
 $("cancelForm").onclick=()=>{$("formArea").innerHTML=""};
 $("addForm").addEventListener("submit",async e=>{
  e.preventDefault();clearMessage();
  try{const [path,payload]=submit();await api(path,{method:"POST",body:JSON.stringify(payload)});message("Saved.","success");await refreshData()}
  catch(err){message("Could not save: "+err.message+(err.details?"\n"+err.details:""),"error")}
 });
}
async function toggleCenter(id,active){try{await api("/v1/centers/"+id,{method:"PATCH",body:JSON.stringify({isActive:active})});await refreshData()}catch(err){message("Could not update: "+err.message,"error")}}
function editLoan(id){
 const loan=data.loans.find(l=>l.loanId===id);if(!loan)return;
 const reasons=data.reasons.map(r=>[r.reasonId,r.reasonName]);
 const loc=iso=>{const d=new Date(iso);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
 $("formArea").innerHTML='<form id="editForm"><p class="muted">Editing loan #'+id+' for '+esc(loan.participantCode)+' · '+esc(deviceName(loan.deviceId))+'</p><div class="formgrid">'+select("e_reason","Reason for loan",reasons)+field("e_due","Due","datetime-local",'value="'+loc(loan.dueDate)+'"')+'</div><button type="submit">Save changes</button><button type="button" class="secondary" id="cancelEdit">Cancel</button></form>';
 $("e_reason").value=String(loan.reasonId);
 $("cancelEdit").onclick=()=>{$("formArea").innerHTML=""};
 $("editForm").addEventListener("submit",async e=>{
  e.preventDefault();clearMessage();
  const body={};const rid=Number($("e_reason").value);if(rid!==loan.reasonId)body.reasonId=rid;
  const due=new Date($("e_due").value).toISOString();if(due!==new Date(loan.dueDate).toISOString())body.dueDate=due;
  if(!Object.keys(body).length){message("Nothing to update.","error");return}
  try{await api("/v1/loans/"+id,{method:"PATCH",body:JSON.stringify(body)});message("Loan updated.","success");await refreshData()}
  catch(err){message("Could not update: "+err.message+(err.details?"\n"+err.details:""),"error")}
 });
}
async function cancelRequest(id){try{await api("/v1/me/requests/"+id+"/cancel",{method:"POST",body:"{}"});message("Request cancelled.","success");await refreshData()}catch(err){message("Could not cancel: "+err.message,"error")}}
async function denyRequest(id){if(!confirm("Deny this equipment request?"))return;try{await api("/v1/requests/"+id+"/deny",{method:"POST",body:"{}"});message("Request denied.","success");await refreshData()}catch(err){message("Could not deny: "+err.message,"error")}}
function approveRequest(id){
 const r=data.requests.find(x=>x.requestId===id);if(!r)return;
 const devices=data.inventory.filter(d=>d.status==="AVAILABLE"&&d.deviceType===r.deviceType&&d.centerId===r.centerId).map(d=>[d.deviceId,d.assetTag+" · "+d.manufacturer+" "+d.model]);
 if(!devices.length){message("No available "+r.deviceType.toLowerCase()+" at "+centerName(r.centerId)+".","error");return}
 const reasons=data.reasons.map(x=>[x.reasonId,x.reasonName]);
 const due=new Date(Date.now()+14*864e5),loc=new Date(due.getTime()-due.getTimezoneOffset()*6e4).toISOString().slice(0,16);
 $("formArea").innerHTML='<form id="approveForm"><p class="muted">Assigning to '+esc(r.userEmail)+' at '+esc(centerName(r.centerId))+' — "'+esc(r.reasonText)+'"</p><div class="formgrid">'+select("a_device","Equipment",devices)+select("a_reason","Loan reason",reasons)+field("a_due","Due","datetime-local",'value="'+loc+'"')+'</div><button type="submit">Assign equipment</button><button type="button" class="secondary" id="cancelApprove">Cancel</button></form>';
 if(r.reasonId)$("a_reason").value=String(r.reasonId);
 $("cancelApprove").onclick=()=>{$("formArea").innerHTML=""};
 $("approveForm").addEventListener("submit",async e=>{
  e.preventDefault();clearMessage();
  try{await api("/v1/requests/"+id+"/approve",{method:"POST",body:JSON.stringify({deviceId:Number($("a_device").value),reasonId:Number($("a_reason").value),dueDate:new Date($("a_due").value).toISOString()})});message("Equipment assigned.","success");await refreshData()}
  catch(err){message("Could not assign: "+err.message,"error")}
 });
}
async function returnLoan(id){try{await api("/v1/loans/"+id+"/return",{method:"POST",body:"{}"});message("Loan marked returned.","success");await refreshData()}catch(err){message("Could not update: "+err.message,"error")}}
async function resolveMaintenance(id){try{await api("/v1/maintenance/"+id+"/resolve",{method:"POST",body:"{}"});message("Maintenance marked resolved.","success");await refreshData()}catch(err){message("Could not update: "+err.message,"error")}}
async function toggleUser(id,active){try{await api("/v1/users/"+id,{method:"PATCH",body:JSON.stringify({isActive:active})});await refreshData()}catch(err){message("Could not update: "+err.message,"error")}}
</script>
</body>
</html>
